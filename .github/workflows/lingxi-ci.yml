name: Lingxi CI

on:
  pull_request:
    branches:
      - main
      - "integration/openchamber-lingxi-*"

permissions:
  contents: read

jobs:
  verify:
    name: Lingxi Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_infra_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          release_infra_only=true

          for file in "${files[@]}"; do
            echo "changed: $file"

            case "$file" in
              *.md|LICENSE|NOTICE)
                ;;
              *)
                docs_only=false
                ;;
            esac

            case "$file" in
              *.md|LICENSE|NOTICE|.github/workflows/lingxi-*.yml|scripts/release/*|.lingxi/releases/*|.lingxi/security/*|docs/releases/*)
                ;;
              *)
                release_infra_only=false
                ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "release_infra_only=$release_infra_only" >> "$GITHUB_OUTPUT"

      - name: Docs-only validation
        if: steps.scope.outputs.docs_only == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"
          echo "✓ Documentation-only change; full build suite skipped."

      - name: Setup Bun
        if: steps.scope.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install release tooling dependencies
        if: steps.scope.outputs.release_infra_only == 'true' && steps.scope.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release-infrastructure validation
        if: steps.scope.outputs.release_infra_only == 'true' && steps.scope.outputs.docs_only != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git diff --check "$BASE_SHA...$HEAD_SHA"

          if [ -f scripts/release/lingxi-release.mjs ]; then
            node scripts/release/lingxi-release.mjs check
          fi

          if [ -f scripts/release/lingxi-release.test.mjs ]; then
            node --test scripts/release/lingxi-release.test.mjs
          fi

          echo "✓ Release-infrastructure change; full application build suite skipped."

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.release_infra_only != 'true'
        run: bun install --frozen-lockfile

      - name: Type check
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.release_infra_only != 'true'
        run: bun run type-check

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.release_infra_only != 'true'
        run: bun run lint

      - name: Test
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.release_infra_only != 'true'
        run: bun run test

      - name: Build
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.release_infra_only != 'true'
        run: bun run build
