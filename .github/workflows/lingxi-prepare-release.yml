name: LingXi Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: LingXi version without the lingxi-v prefix
        required: true
        type: string
      source_ref:
        description: Canonical integration branch to prepare
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate canonical branch
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: test "$SOURCE_REF" = "integration/openchamber-lingxi-$VERSION"

      - name: Checkout integration source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record immutable source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Verify source dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare version and lockfile
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/lingxi-release.mjs prepare "$VERSION"

      - name: Enforce preparation scope
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r file; do
            case "$file" in
              bun.lock|packages/electron/package.json) ;;
              *) echo "Unexpected preparation change: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Upload prepared files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lingxi-${{ inputs.version }}-prepared-files
          path: |
            bun.lock
            packages/electron/package.json
          if-no-files-found: error
          retention-days: 1

  create-pull-request:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download prepared files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lingxi-${{ inputs.version }}-prepared-files
          path: ${{ runner.temp }}/lingxi-prepared

      - name: Apply prepared files
        env:
          PREPARED: ${{ runner.temp }}/lingxi-prepared
        run: |
          set -euo pipefail
          test -f "$PREPARED/bun.lock"
          test -f "$PREPARED/packages/electron/package.json"
          test ! -L "$PREPARED/bun.lock"
          test ! -L "$PREPARED/packages/electron/package.json"
          test ! -L bun.lock
          test ! -L packages/electron/package.json
          cp "$PREPARED/bun.lock" bun.lock
          cp "$PREPARED/packages/electron/package.json" packages/electron/package.json
          changed=$(git diff --name-only)
          test "$changed" = $'bun.lock\npackages/electron/package.json'

      - name: Create preparation pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          branch="release/lingxi-${VERSION}-prepare-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          git add bun.lock packages/electron/package.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "release: prepare LingXiFox ${VERSION}"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE" \
            --head "$branch" \
            --title "release: prepare LingXiFox ${VERSION}" \
            --body "Prepares the Electron product version and Bun workspace lock entry for \`lingxi-v${VERSION}\`. Release records and native dry-runs remain required before tagging."
