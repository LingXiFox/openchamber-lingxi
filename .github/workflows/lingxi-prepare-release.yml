name: LingXi Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: LingXi version without the lingxi-v prefix
        required: true
        type: string
      source_ref:
        description: Canonical integration branch to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Validate canonical branch
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = "integration/openchamber-lingxi-$VERSION"

      - name: Checkout integration source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install release tooling dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          electron_version=$(node -p "require('./packages/electron/package.json').version")

          test "$electron_version" = "$VERSION" || {
            echo "Expected Electron version $VERSION, got $electron_version" >&2
            exit 1
          }

          node scripts/release/lingxi-release.mjs check

      - name: Confirm source is clean
        run: git diff --exit-code